<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Governance Readiness Assessment for SMBs</title>
<style>
  :root {
    --bg: #fafaf7;
    --surface: #ffffff;
    --surface-alt: #f4f2ec;
    --text: #1a1a1a;
    --text-secondary: #5f5e5a;
    --text-muted: #888780;
    --border: rgba(0,0,0,0.08);
    --border-strong: rgba(0,0,0,0.16);
    --accent: #185FA5;
    --accent-bg: #E6F1FB;
    --accent-text: #0C447C;
    --success-bg: #EAF3DE;
    --success-text: #27500A;
    --warning-bg: #FAEEDA;
    --warning-text: #633806;
    --danger-bg: #FCEBEB;
    --danger-text: #791F1F;
    --radius: 8px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 15px;
    line-height: 1.6;
  }
  .container { max-width: 820px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }
  .hero { margin-bottom: 1.5rem; }
  .kicker { font-size: 12px; color: var(--accent); letter-spacing: 0.04em; text-transform: uppercase; margin: 0 0 6px; font-weight: 500; }
  h1 { font-size: 28px; font-weight: 500; margin: 0 0 8px; letter-spacing: -0.01em; }
  h2 { font-size: 18px; font-weight: 500; margin: 0 0 10px; }
  .lede { font-size: 15px; color: var(--text-secondary); margin: 0; }

  .stepper { display: flex; align-items: center; gap: 8px; margin-bottom: 1.5rem; font-size: 12px; color: var(--text-muted); }
  .step { display: flex; align-items: center; gap: 6px; }
  .step.active { color: var(--accent); font-weight: 500; }
  .step-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-muted); }
  .step.active .step-dot { background: var(--accent); }
  .step.complete .step-dot { background: var(--success-text); }
  .step-sep { color: var(--text-muted); }

  .profile-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: 12px; padding: 1.5rem; margin-bottom: 1rem; }
  .field-group { margin-bottom: 1.25rem; }
  .field-group:last-child { margin-bottom: 0; }
  .field-label { display: block; font-size: 14px; font-weight: 500; margin: 0 0 6px; }
  .field-hint { font-size: 12px; color: var(--text-muted); margin: 0 0 8px; }
  .field-required { color: var(--danger-text); }

  .radio-row, .checkbox-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .radio-opt, .check-opt {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 8px 14px; border: 0.5px solid var(--border); border-radius: var(--radius);
    cursor: pointer; font-size: 14px; background: transparent; transition: all 0.12s;
  }
  .radio-opt:hover, .check-opt:hover { border-color: var(--border-strong); }
  .radio-opt.selected, .check-opt.selected { border: 2px solid var(--accent); padding: calc(8px - 1.5px) calc(14px - 1.5px); background: var(--accent-bg); }
  .radio-opt input, .check-opt input { margin: 0; }

  select, input[type="text"] {
    width: 100%; padding: 8px 12px; border: 0.5px solid var(--border); border-radius: var(--radius);
    font: inherit; background: var(--surface); color: var(--text);
  }
  select:focus, input[type="text"]:focus { outline: none; border-color: var(--accent); }

  .tools-search { position: relative; margin-bottom: 1rem; }
  .tools-search input { padding-left: 32px; }
  .tools-search::before {
    content: '⌕'; position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
    color: var(--text-muted); font-size: 16px;
  }
  .tools-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 8px; margin-bottom: 1rem; }
  .tool-card {
    display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px;
    border: 0.5px solid var(--border); border-radius: var(--radius); cursor: pointer;
    background: transparent; text-align: left; transition: all 0.12s;
  }
  .tool-card:hover { border-color: var(--border-strong); }
  .tool-card.selected { border: 2px solid var(--accent); padding: calc(10px - 1.5px) calc(12px - 1.5px); background: var(--accent-bg); }
  .tool-card input { margin: 3px 0 0 0; }
  .tool-info { flex: 1; min-width: 0; }
  .tool-name { font-size: 13px; font-weight: 500; margin: 0 0 2px; }
  .tool-meta { font-size: 11px; color: var(--text-muted); margin: 0; }
  .tool-badge { font-size: 10px; padding: 1px 6px; border-radius: var(--radius); margin-left: 4px; font-weight: 500; vertical-align: 1px; }
  .tool-badge.high { background: var(--danger-bg); color: var(--danger-text); }
  .tool-badge.caution { background: var(--warning-bg); color: var(--warning-text); }
  .tool-badge.low { background: var(--success-bg); color: var(--success-text); }

  .other-tool-input { display: flex; gap: 8px; margin-bottom: 1rem; }
  .other-tool-input input { flex: 1; }
  .other-tool-list { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .other-tag {
    display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px;
    background: var(--accent-bg); color: var(--accent-text); border-radius: var(--radius); font-size: 12px;
  }
  .other-tag button { background: none; border: none; color: inherit; cursor: pointer; padding: 0; font-size: 14px; line-height: 1; }

  .choice-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin: 1.25rem 0 1rem; }
  .choice {
    background: var(--surface); border: 0.5px solid var(--border); border-radius: 12px;
    padding: 1rem 1.25rem; cursor: pointer; text-align: left; font: inherit; color: inherit;
    transition: border-color 0.12s;
  }
  .choice:hover { border-color: var(--border-strong); }
  .choice.selected { border: 2px solid var(--accent); padding: calc(1rem - 1.5px) calc(1.25rem - 1.5px); }
  .choice h3 { font-size: 15px; font-weight: 500; margin: 0 0 6px; }
  .meta { font-size: 12px; color: var(--text-muted); margin: 0 0 8px; }
  .choice p { font-size: 13px; color: var(--text-secondary); margin: 0; }
  .badge { display: inline-block; background: var(--accent-bg); color: var(--accent-text); font-size: 11px; padding: 2px 8px; border-radius: var(--radius); margin-left: 6px; vertical-align: 2px; }

  .callout {
    background: var(--surface-alt); border-radius: var(--radius); padding: 12px 14px;
    font-size: 13px; color: var(--text-secondary); margin: 0.75rem 0 1rem; line-height: 1.5;
  }
  .callout strong { color: var(--text); font-weight: 500; }
  .callout.info { background: var(--accent-bg); color: var(--accent-text); }
  .callout.info strong { color: var(--accent-text); }
  .callout.warning { background: var(--warning-bg); color: var(--warning-text); }
  .callout.warning strong { color: var(--warning-text); }

  button {
    background: var(--surface); border: 0.5px solid var(--border-strong); border-radius: var(--radius);
    padding: 8px 16px; font: inherit; color: var(--text); cursor: pointer; transition: background 0.12s;
  }
  button:hover:not(:disabled) { background: var(--surface-alt); }
  button:active:not(:disabled) { transform: scale(0.98); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button.primary { background: var(--text); color: white; border-color: var(--text); }
  button.primary:hover:not(:disabled) { background: #333; }

  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 0.5rem; }

  .qcard { background: var(--surface); border: 0.5px solid var(--border); border-radius: 12px; padding: 1.5rem; }
  .qhead { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--text-muted); margin-bottom: 8px; }
  .qmodule { display: inline-block; padding: 1px 8px; background: var(--accent-bg); color: var(--accent-text); border-radius: var(--radius); font-size: 11px; font-weight: 500; }
  .progress { height: 4px; background: var(--surface-alt); border-radius: 2px; overflow: hidden; margin-bottom: 16px; }
  .progress span { display: block; height: 100%; background: var(--accent); width: 0; transition: width 0.2s; }
  .qtext { font-size: 17px; font-weight: 500; margin: 0 0 4px; }
  .qmeta { font-size: 13px; color: var(--text-muted); margin: 0 0 14px; }

  .options { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
  .opt {
    display: flex; align-items: center; gap: 10px; padding: 10px 14px;
    border: 0.5px solid var(--border); border-radius: var(--radius);
    cursor: pointer; font-size: 14px; background: transparent;
  }
  .opt:hover { border-color: var(--border-strong); }
  .opt.selected { border: 2px solid var(--accent); padding: calc(10px - 1.5px) calc(14px - 1.5px); background: var(--accent-bg); }
  .opt input { margin: 0; }

  .err { color: var(--danger-text); font-size: 13px; margin: 6px 0 0; }
  .nav { display: flex; justify-content: space-between; gap: 8px; margin-top: 14px; }
  .nav .spacer { flex: 1; }

  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 1rem 0 1.25rem; }
  .stat { background: var(--surface-alt); border-radius: var(--radius); padding: 1rem 1.25rem; }
  .stat-label { font-size: 12px; color: var(--text-secondary); margin: 0 0 4px; }
  .stat-value { font-size: 28px; font-weight: 500; margin: 0; }
  .stat-value.small { font-size: 16px; padding-top: 4px; }

  .tier-pill { display: inline-flex; align-items: center; padding: 4px 12px; border-radius: 12px; font-size: 13px; font-weight: 500; }
  .tier-low { background: var(--success-bg); color: var(--success-text); }
  .tier-med { background: var(--warning-bg); color: var(--warning-text); }
  .tier-high { background: var(--danger-bg); color: var(--danger-text); }

  .section { margin: 1.5rem 0; }

  .fn-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
  .fn { background: var(--surface-alt); border-radius: var(--radius); padding: 12px 14px; }
  .fn-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
  .fn h3 { font-size: 14px; font-weight: 500; margin: 0; }
  .fn-score { font-size: 13px; color: var(--text-secondary); font-weight: 500; }
  .bar { height: 4px; background: var(--surface); border-radius: 2px; overflow: hidden; }
  .bar span { display: block; height: 100%; background: var(--accent); width: 0; transition: width 0.4s; }
  .fn-desc { font-size: 11px; color: var(--text-muted); margin: 6px 0 0; }

  .rec { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 8px; }
  .rec-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 4px; }
  .rec-title { font-size: 14px; font-weight: 500; margin: 0; }
  .rec-meta { font-size: 11px; color: var(--text-muted); margin: 0 0 6px; }
  .rec-body { font-size: 13px; color: var(--text-secondary); margin: 0; }
  .rec-source { font-size: 11px; color: var(--text-muted); margin: 6px 0 0; font-style: italic; }
  .prio-high { background: var(--danger-bg); color: var(--danger-text); font-size: 11px; padding: 2px 8px; border-radius: var(--radius); white-space: nowrap; font-weight: 500; }
  .prio-med { background: var(--warning-bg); color: var(--warning-text); font-size: 11px; padding: 2px 8px; border-radius: var(--radius); white-space: nowrap; font-weight: 500; }
  .prio-low { background: var(--success-bg); color: var(--success-text); font-size: 11px; padding: 2px 8px; border-radius: var(--radius); white-space: nowrap; font-weight: 500; }

  .tool-review { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 8px; }
  .tool-review-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 6px; }
  .tool-review-name { font-size: 14px; font-weight: 500; margin: 0; }
  .tool-review-body { font-size: 13px; color: var(--text-secondary); margin: 0; }
  .tool-review-sources { font-size: 11px; color: var(--text-muted); margin: 6px 0 0; }
  .tool-review-sources a { color: var(--accent); text-decoration: none; }
  .tool-review-sources a:hover { text-decoration: underline; }

  .roadmap { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-top: 0.5rem; }
  .phase { background: var(--surface-alt); border-radius: var(--radius); padding: 14px; }
  .plabel { font-size: 11px; color: var(--text-muted); margin: 0 0 4px; text-transform: uppercase; letter-spacing: 0.04em; font-weight: 500; }
  .phase h4 { font-size: 14px; font-weight: 500; margin: 0 0 8px; }
  .phase ul { margin: 0; padding-left: 18px; font-size: 13px; color: var(--text-secondary); }
  .phase li { margin-bottom: 4px; }

  .scope-banner { background: var(--accent-bg); border-radius: var(--radius); padding: 14px 16px; margin: 1rem 0; font-size: 13px; color: var(--accent-text); line-height: 1.5; }
  .scope-banner strong { font-weight: 500; }

  .disclaimer { font-size: 12px; color: var(--text-muted); margin-top: 1.5rem; padding-top: 1rem; border-top: 0.5px solid var(--border); line-height: 1.5; }
  .disclaimer strong { color: var(--text-secondary); font-weight: 500; }

  .empty-tools { text-align: center; color: var(--text-muted); font-size: 13px; padding: 1rem; font-style: italic; }

  .hidden { display: none; }
</style>
</head>
<body>
<div class="container">
  <div id="stepper" class="stepper hidden"></div>
  <div id="stage-intro"></div>
  <div id="stage-profile" class="hidden"></div>
  <div id="stage-tools" class="hidden"></div>
  <div id="stage-depth" class="hidden"></div>
  <div id="stage-quiz" class="hidden"></div>
  <div id="stage-report" class="hidden"></div>
</div>

<script>
// ============================================================================
// PURE LOGIC LAYER: Framework definitions and data
// Kept as pure data structures for future testability (Phase B: extract to modules)
// ============================================================================

var FRAMEWORK = {
  functions: {
    govern:  { name: 'Govern',  desc: 'Policies, roles, accountability' },
    map:     { name: 'Map',     desc: 'Context, use cases, risks identified' },
    measure: { name: 'Measure', desc: 'Testing, monitoring, metrics' },
    manage:  { name: 'Manage',  desc: 'Response, mitigation, incident handling' }
  }
};

// Industry list. Not all industries get overlays. Those that don't get honest scoping banner.
var INDUSTRIES = [
  { id: 'nonprofit-social', label: 'Nonprofit / Social services' },
  { id: 'education', label: 'Education' },
  { id: 'healthcare', label: 'Healthcare / Life sciences' },
  { id: 'financial', label: 'Financial services' },
  { id: 'technology', label: 'Technology / Software' },
  { id: 'retail', label: 'Retail / E-commerce' },
  { id: 'manufacturing', label: 'Manufacturing / Industrial' },
  { id: 'professional', label: 'Professional services / Consulting' },
  { id: 'media', label: 'Media / Creative / Marketing' },
  { id: 'government', label: 'Government / Public sector' },
  { id: 'hospitality', label: 'Hospitality / Food service' },
  { id: 'other', label: 'Other' }
];

// Base NIST questions (from v1, unchanged)
var BASE_QUESTIONS = [
  { id: 'g1', fn: 'govern', module: 'base', depths: ['quick','standard','comprehensive'],
    text: 'Does your business have a written policy on how employees can use AI tools?',
    hint: 'Includes ChatGPT, Copilot, Gemini, or any AI feature inside existing software.',
    options: [
      { v: 0, label: 'No policy exists' },
      { v: 1, label: 'Informal guidance only' },
      { v: 2, label: 'Written policy, not consistently followed' },
      { v: 3, label: 'Written policy, reviewed and enforced' }
    ]},
  { id: 'g2', fn: 'govern', module: 'base', depths: ['quick','standard','comprehensive'],
    text: 'Who is accountable when an AI tool causes a problem?',
    hint: 'Wrong output sent to a customer, sensitive data exposed to a model, and so on.',
    options: [
      { v: 0, label: 'No one has been named' },
      { v: 1, label: 'Unclear, depends on the situation' },
      { v: 2, label: 'A specific person, but not documented' },
      { v: 3, label: 'A named owner with documented responsibility' }
    ]},
  { id: 'g3', fn: 'govern', module: 'base', depths: ['standard','comprehensive'],
    text: 'Do you have an approval process before adopting new AI tools?',
    options: [
      { v: 0, label: 'No, teams adopt tools freely' },
      { v: 1, label: 'Ad hoc, sometimes reviewed' },
      { v: 2, label: 'Yes, informal review' },
      { v: 3, label: 'Formal review with approval criteria' }
    ]},
  { id: 'g4', fn: 'govern', module: 'base', depths: ['comprehensive'],
    text: 'Do you train employees on responsible AI use?',
    options: [
      { v: 0, label: 'No training' },
      { v: 1, label: 'One-time onboarding mention' },
      { v: 2, label: 'Occasional refreshers' },
      { v: 3, label: 'Structured, role-specific, updated regularly' }
    ]},
  { id: 'g5', fn: 'govern', module: 'base', depths: ['comprehensive'],
    text: 'Are AI risks discussed at leadership or board level?',
    options: [
      { v: 0, label: 'Never' },
      { v: 1, label: 'Only after incidents' },
      { v: 2, label: 'Occasionally as part of tech updates' },
      { v: 3, label: 'Regularly, with dedicated agenda time' }
    ]},
  { id: 'm1', fn: 'map', module: 'base', depths: ['quick','standard','comprehensive'],
    text: 'Do you know which AI tools your team is actually using?',
    hint: 'Includes tools built into products you already pay for.',
    options: [
      { v: 0, label: 'No visibility' },
      { v: 1, label: 'A rough idea, not documented' },
      { v: 2, label: 'Documented list, updated occasionally' },
      { v: 3, label: 'Current inventory reviewed quarterly' }
    ]},
  { id: 'm2', fn: 'map', module: 'base', depths: ['quick','standard','comprehensive'],
    text: 'For each AI use case, have you identified who could be harmed by a mistake?',
    options: [
      { v: 0, label: 'Not considered' },
      { v: 1, label: 'Considered for one or two visible cases' },
      { v: 2, label: 'Considered for most cases' },
      { v: 3, label: 'Systematic impact analysis per use case' }
    ]},
  { id: 'm3', fn: 'map', module: 'base', depths: ['standard','comprehensive'],
    text: 'Do you classify AI use cases by risk level?',
    hint: 'Example: low (drafting), medium (customer response), high (hiring, credit, medical).',
    options: [
      { v: 0, label: 'No classification' },
      { v: 1, label: 'Informal, case by case' },
      { v: 2, label: 'Simple tiers used sometimes' },
      { v: 3, label: 'Documented tiers applied to every new use case' }
    ]},
  { id: 'm4', fn: 'map', module: 'base', depths: ['comprehensive'],
    text: 'Do you know what data your AI tools can access?',
    options: [
      { v: 0, label: 'No, and no easy way to find out' },
      { v: 1, label: 'Only for the biggest tools' },
      { v: 2, label: 'Mostly known, some gaps' },
      { v: 3, label: 'Fully mapped, reviewed regularly' }
    ]},
  { id: 'm5', fn: 'map', module: 'base', depths: ['comprehensive'],
    text: 'Do you evaluate third-party AI vendors before onboarding them?',
    options: [
      { v: 0, label: 'No vendor review' },
      { v: 1, label: 'Informal check of the website' },
      { v: 2, label: 'Basic security or privacy questionnaire' },
      { v: 3, label: 'Structured review including AI-specific risks' }
    ]},
  { id: 'me1', fn: 'measure', module: 'base', depths: ['quick','standard','comprehensive'],
    text: 'How do you check whether AI output is accurate or reliable?',
    options: [
      { v: 0, label: 'We do not check' },
      { v: 1, label: 'Users spot-check when they notice something odd' },
      { v: 2, label: 'Sampling reviews on high-stakes outputs' },
      { v: 3, label: 'Structured review with documented metrics' }
    ]},
  { id: 'me2', fn: 'measure', module: 'base', depths: ['quick','standard','comprehensive'],
    text: 'Do you track incidents related to AI use?',
    hint: 'Wrong outputs sent externally, prompt leakage, biased results, and so on.',
    options: [
      { v: 0, label: 'No tracking' },
      { v: 1, label: 'Only major incidents get discussed' },
      { v: 2, label: 'Informal log kept' },
      { v: 3, label: 'Formal incident register with review cadence' }
    ]},
  { id: 'me3', fn: 'measure', module: 'base', depths: ['standard','comprehensive'],
    text: 'Do you monitor for bias in AI outputs that affect people?',
    hint: 'Especially in hiring, customer service, pricing, or eligibility decisions.',
    options: [
      { v: 0, label: 'Not monitored' },
      { v: 1, label: 'Considered, no active checks' },
      { v: 2, label: 'Periodic manual review' },
      { v: 3, label: 'Regular structured testing' }
    ]},
  { id: 'me4', fn: 'measure', module: 'base', depths: ['comprehensive'],
    text: 'Do you keep records of AI decisions that affect customers or employees?',
    options: [
      { v: 0, label: 'No records' },
      { v: 1, label: 'Kept only when someone complains' },
      { v: 2, label: 'Some records, inconsistent' },
      { v: 3, label: 'Systematic logging with retention policy' }
    ]},
  { id: 'me5', fn: 'measure', module: 'base', depths: ['comprehensive'],
    text: 'How often do you re-evaluate the AI tools you use?',
    options: [
      { v: 0, label: 'Never after initial adoption' },
      { v: 1, label: 'When something goes wrong' },
      { v: 2, label: 'Annually' },
      { v: 3, label: 'On a defined cadence with criteria' }
    ]},
  { id: 'ma1', fn: 'manage', module: 'base', depths: ['quick','standard','comprehensive'],
    text: 'If an AI tool produced a harmful output right now, what happens next?',
    options: [
      { v: 0, label: 'Nothing formal, depends who notices' },
      { v: 1, label: 'Someone would raise it informally' },
      { v: 2, label: 'Escalation path exists but is untested' },
      { v: 3, label: 'Documented response plan, tested at least once' }
    ]},
  { id: 'ma2', fn: 'manage', module: 'base', depths: ['quick','standard','comprehensive'],
    text: 'Can you turn off or roll back an AI tool quickly if needed?',
    options: [
      { v: 0, label: 'No, would take days or longer' },
      { v: 1, label: 'Yes, but painful and slow' },
      { v: 2, label: 'Yes, within a few hours' },
      { v: 3, label: 'Yes, quickly and with a documented process' }
    ]},
  { id: 'ma3', fn: 'manage', module: 'base', depths: ['standard','comprehensive'],
    text: 'Do customers or employees know when they are interacting with AI?',
    options: [
      { v: 0, label: 'Never disclosed' },
      { v: 1, label: 'Sometimes, inconsistently' },
      { v: 2, label: 'Disclosed in most customer-facing cases' },

function getApplicableModules(profile) {
  var modules = ['base'];
  if (profile.orgType === 'nonprofit') modules.push('nonprofit');
  if (profile.servesYouth === true) modules.push('youth');
  return modules;
}

function getQuestionsForAssessment(profile, depth) {
  var modules = getApplicableModules(profile);
  var pool = [];
  if (modules.indexOf('base') !== -1) pool = pool.concat(BASE_QUESTIONS);
  if (modules.indexOf('nonprofit') !== -1) pool = pool.concat(NONPROFIT_QUESTIONS);
  if (modules.indexOf('youth') !== -1) pool = pool.concat(YOUTH_QUESTIONS);
  return pool.filter(function(q) { return q.depths.indexOf(depth) !== -1; });
}

function computeScores(questions, answers) {
  var fnScores = {
    govern: { sum: 0, max: 0 },
    map: { sum: 0, max: 0 },
    measure: { sum: 0, max: 0 },
    manage: { sum: 0, max: 0 }
  };
  questions.forEach(function(q) {
    if (answers[q.id] !== undefined) {
      fnScores[q.fn].sum += answers[q.id];
      fnScores[q.fn].max += 3;
    }
  });
  var totalSum = 0, totalMax = 0;
  Object.keys(fnScores).forEach(function(k) {
    totalSum += fnScores[k].sum;
    totalMax += fnScores[k].max;
  });
  var overall = totalMax === 0 ? 0 : Math.round((totalSum / totalMax) * 100);
  return { fnScores: fnScores, overall: overall, totalSum: totalSum, totalMax: totalMax };
}

function computeTier(overall) {
  if (overall >= 70) return {
    key: 'low', cssClass: 'tier-low', label: 'Lower risk',
    desc: 'Your governance is meaningfully ahead of most SMBs. Focus on maintaining rigor and closing the last gaps before a formal audit or vendor review.'
  };
  if (overall >= 40) return {
    key: 'medium', cssClass: 'tier-med', label: 'Moderate risk',
    desc: 'Reasonable foundations, but real gaps exist. You are exposed if a high-impact incident happens or a customer asks for evidence of governance.'
  };
  return {
    key: 'high', cssClass: 'tier-high', label: 'Higher risk',
    desc: 'Governance is largely informal or absent. Prioritize the basics before adopting more AI tools or expanding sensitive use cases.'
  };
}

function identifyGaps(questions, answers) {
  var gaps = [];
  questions.forEach(function(q) {
    var v = answers[q.id];
    if (v !== undefined && v <= 1) {
      gaps.push({ fn: q.fn, module: q.module, q: q, v: v, priority: v === 0 ? 'high' : 'medium' });
    }
  });
  return gaps;
}

function buildRecommendations(gaps) {
  var seen = {};
  var recs = [];
  ['high','medium'].forEach(function(pri) {
    gaps.filter(function(g) { return g.priority === pri; }).forEach(function(g) {
      var key = g.q.id;
      if (seen[key]) return;
      seen[key] = true;
      var body = REC_BODIES[g.q.id] || 
        ((g.v === 0 ? 'No baseline in place today. ' : 'A partial baseline exists. ') +
         'This gap sits in the ' + FRAMEWORK.functions[g.fn].name + ' function of the NIST AI RMF. Closing it is one of the highest-value moves you can make with limited time and budget, and it produces evidence you can point to if a customer, regulator, or insurer asks.');
      recs.push({
        priority: pri, fn: g.fn, module: g.q.module,
        title: REC_TITLES[g.q.id] || 'Address this gap',
        body: body
      });
    });
  });
  return recs;
}

function classifyToolsInUse(selectedToolIds, otherTools) {
  var flagged = { 'high-risk': [], 'caution': [], 'lower-risk': [] };
  selectedToolIds.forEach(function(id) {
    var tool = TOOL_MASTER_LIST.find(function(t) { return t.id === id; });
    if (tool) flagged[tool.classification].push(tool);
  });
  return { flagged: flagged, otherTools: otherTools };
}

function filterToolsForProfile(profile) {
  return TOOL_MASTER_LIST.filter(function(tool) {
    return tool.industries.indexOf('all') !== -1 ||
           tool.industries.indexOf(profile.industry) !== -1;
  });
}

function renderStepper(currentStep) {
  var steps = [
    { id: 'profile', label: 'Profile' },
    { id: 'tools', label: 'Tools' },
    { id: 'depth', label: 'Depth' },
    { id: 'assess', label: 'Assessment' },
    { id: 'report', label: 'Report' }
  ];
  var stepper = el('stepper');
  var currentIdx = steps.findIndex(function(s) { return s.id === currentStep; });
  stepper.classList.remove('hidden');
  stepper.innerHTML = steps.map(function(s, i) {
    var cls = 'step';
    if (i < currentIdx) cls += ' complete';
    if (i === currentIdx) cls += ' active';
    return '<div class="' + cls + '"><span class="step-dot"></span>' + s.label + '</div>' +
      (i < steps.length - 1 ? '<span class="step-sep">→</span>' : '');
  }).join('');
}

function radioBtn(name, value, label, selected) {
  return '<label class="radio-opt' + (selected ? ' selected' : '') + '" data-name="' + name + '" data-value="' + value + '">' +

    '<span>' + label + '</span></label>';
}

function checkBtn(name, value, label, selected) {
  return '<label class="check-opt' + (selected ? ' selected' : '') + '" data-name="' + name + '" data-value="' + value + '">' +
    '<input type="checkbox" name="' + name + '" value="' + value + '"' + (selected ? ' checked' : '') + '>' +
    '<span>' + label + '</span></label>';
}

function attachRadioHandlers(name, onChange) {
  document.querySelectorAll('.radio-opt[data-name="' + name + '"]').forEach(function(el) {
    el.addEventListener('click', function() {
      document.querySelectorAll('.radio-opt[data-name="' + name + '"]').forEach(function(other) {
        other.classList.remove('selected');
        other.querySelector('input').checked = false;
      });
      el.classList.add('selected');
      el.querySelector('input').checked = true;
      onChange(el.getAttribute('data-value'));
    });
  });
}

function attachCheckHandlers(name, targetArray) {
  document.querySelectorAll('.check-opt[data-name="' + name + '"]').forEach(function(el) {
    el.addEventListener('click', function(e) {
      if (e.target.tagName === 'INPUT') return;
      var v = el.getAttribute('data-value');
      var input = el.querySelector('input');
      var idx = targetArray.indexOf(v);
      if (idx === -1) {
        targetArray.push(v);
        el.classList.add('selected');
        input.checked = true;
      } else {
        targetArray.splice(idx, 1);
        el.classList.remove('selected');
        input.checked = false;
      }
    });
    el.querySelector('input').addEventListener('change', function(e) {
      var v = el.getAttribute('data-value');
      var idx = targetArray.indexOf(v);
      if (e.target.checked && idx === -1) {
        targetArray.push(v);
        el.classList.add('selected');
      } else if (!e.target.checked && idx !== -1) {
        targetArray.splice(idx, 1);
        el.classList.remove('selected');
      }
    });
  });
}

  var toolAnalysis = classifyToolsInUse(state.toolsSelected, state.otherTools);
  var modules = getApplicableModules(state.profile);

  var highCount = gaps.filter(function(g) { return g.priority === 'high'; }).length;
  var medCount = gaps.filter(function(g) { return g.priority === 'medium'; }).length;

  var confidenceNote;
  if (state.depth === 'quick') confidenceNote = 'Based on a Quick assessment. Directional only. Retake at Standard depth before acting on this.';
  else if (state.depth === 'standard') confidenceNote = 'Based on the Standard assessment. Solid enough for planning; take Comprehensive if preparing for an audit or vendor review.';
  else confidenceNote = 'Based on the Comprehensive assessment. Highest confidence.';

  var industryLabel = state.profile.industry ? INDUSTRIES.find(function(i) { return i.id === state.profile.industry; }).label : '';
  var scopeText = buildScopeText(state.profile, modules);

  var html = '' +
    '<div class="hero"><p class="kicker">Your report</p><h1>AI governance readiness</h1>' +
    '<p class="lede">Based on the NIST AI Risk Management Framework' + (industryLabel ? ', tailored for ' + industryLabel : '') + '.</p></div>';

  if (scopeText) {
    html += '<div class="scope-banner"><strong>What\'s in this report:</strong> ' + scopeText + '</div>';
  }

  html += '<div class="stat-grid">' +
    '<div class="stat"><p class="stat-label">Overall readiness</p><p class="stat-value">' + scores.overall + '%</p></div>' +
    '<div class="stat"><p class="stat-label">Risk tier</p><p class="stat-value small"><span class="tier-pill ' + tier.cssClass + '">' + tier.label + '</span></p></div>' +
    '<div class="stat"><p class="stat-label">Critical gaps</p><p class="stat-value">' + highCount + '</p></div>' +
    '<div class="stat"><p class="stat-label">Moderate gaps</p><p class="stat-value">' + medCount + '</p></div>' +
  '</div>';

  html += '<div class="callout">' + tier.desc + '</div>';

  // Tool review section (new in v2)
  if (state.toolsSelected.length > 0 || state.otherTools.length > 0) {
    html += '<div class="section"><h2>AI tools currently in use</h2>' + renderToolReview(toolAnalysis) + '</div>';
  }

  // Gap map
  html += '<div class="section"><h2>Gap map across NIST functions</h2><div class="fn-grid">' +
    Object.keys(FRAMEWORK.functions).map(function(k) {
      var s = scores.fnScores[k];
      var pct = s.max === 0 ? 0 : Math.round((s.sum / s.max) * 100);
      return '<div class="fn"><div class="fn-top"><h3>' + FRAMEWORK.functions[k].name + '</h3><span class="fn-score">' + pct + '%</span></div>' +
        '<div class="bar"><span style="width:' + pct + '%"></span></div>' +
        '<p class="fn-desc">' + FRAMEWORK.functions[k].desc + '</p></div>';
    }).join('') + '</div></div>';

  // Recommendations
  html += '<div class="section"><h2>Prioritized recommendations</h2>' +
    (recs.length === 0 ? '<div class="callout">You have strong foundations. Lock in a quarterly review to keep governance current.</div>' :
    recs.map(function(r) {
      var cls = r.priority === 'high' ? 'prio-high' : (r.priority === 'medium' ? 'prio-med' : 'prio-low');
      var plabel = r.priority === 'high' ? 'High priority' : (r.priority === 'medium' ? 'Medium priority' : 'Maintain');
      var moduleTag = r.module !== 'base' ? ' • ' + (r.module === 'nonprofit' ? 'Nonprofit module' : 'Youth-serving module') : '';
      return '<div class="rec"><div class="rec-head"><p class="rec-title">' + r.title + '</p>' +
        '<span class="' + cls + '">' + plabel + '</span></div>' +
        '<p class="rec-meta">' + FRAMEWORK.functions[r.fn].name + ' function' + moduleTag + '</p>' +
        '<p class="rec-body">' + r.body + '</p></div>';
    }).join('')) + '</div>';

  // Roadmap
  var high = recs.filter(function(r) { return r.priority === 'high'; }).slice(0, 3);
  var med = recs.filter(function(r) { return r.priority === 'medium'; }).slice(0, 3);
  html += '<div class="section"><h2>Maturity roadmap</h2><div class="roadmap">' +
    '<div class="phase"><p class="plabel">Next 90 days</p><h4>Close critical gaps</h4><ul>' +
      (high.length ? high.map(function(r) { return '<li>' + r.title + '</li>'; }).join('') : '<li>No critical gaps.</li>') +
    '</ul></div>' +
    '<div class="phase"><p class="plabel">3 to 6 months</p><h4>Build the operating rhythm</h4><ul>' +
      (med.length ? med.map(function(r) { return '<li>' + r.title + '</li>'; }).join('') : '<li>Establish quarterly review.</li>') +
    '</ul></div>' +
    '<div class="phase"><p class="plabel">6 to 12 months</p><h4>Formalize and prove</h4>' +
      '<ul><li>Establish a quarterly governance review</li><li>Document a lightweight AI incident playbook</li><li>Add AI risk to standard vendor onboarding</li></ul>' +
    '</div></div></div>';

  html += '<div class="row" style="margin-top: 1.5rem;">' +
    '<button id="btn-restart">Start over</button>' +
    '<div style="flex:1"></div>' +
    '<button id="btn-print" class="primary">Print or save as PDF</button>' +
  '</div>';

  html += '<p class="disclaimer"><strong>About this tool.</strong> Built on the NIST AI Risk Management Framework (Govern, Map, Measure, Manage). Confidence: ' + confidenceNote + ' Tool classifications are point-in-time (last reviewed April 2026) and criteria-based. This is a self-assessment for internal planning, not a compliance certification or legal advice.</p>';

  el('stage-report').innerHTML = html;

  el('btn-restart').addEventListener('click', function() {
    state.profile = { orgType: null, servesYouth: null, industry: null, size: null, region: null, regulated: [], customerType: null, aiMaturity: null };
    state.toolsSelected = [];
    state.otherTools = [];
    state.depth = null;
    state.questions = [];
    state.answers = {};
    state.idx = 0;
    renderIntro();
  });
  el('btn-print').addEventListener('click', function() { window.print(); });
}

function renderToolReview(analysis) {
  var html = '';
  if (analysis.flagged['high-risk'].length > 0) {
    html += '<div class="callout warning"><strong>High-risk tools flagged in your inventory.</strong> These tools have documented safety incidents, active litigation, or fundamental absence of organizational controls. Consider restricting use.</div>';
    analysis.flagged['high-risk'].forEach(function(t) {
      html += renderToolCard(t);
    });
  }
  if (analysis.flagged['caution'].length > 0) {
    html += '<p style="font-size: 13px; color: var(--text-secondary); margin: 1rem 0 0.5rem;"><strong>Tools requiring caution.</strong> These have settings that should be verified before organizational use.</p>';
    analysis.flagged['caution'].forEach(function(t) {
      html += renderToolCard(t);
    });
  }
  if (analysis.flagged['lower-risk'].length > 0) {
    html += '<p style="font-size: 13px; color: var(--text-secondary); margin: 1rem 0 0.5rem;"><strong>Lower-risk tools in your inventory.</strong></p>';
    analysis.flagged['lower-risk'].forEach(function(t) {
      html += renderToolCard(t);
    });
  }
  if (analysis.otherTools.length > 0) {
    html += '<p style="font-size: 13px; color: var(--text-secondary); margin: 1rem 0 0.5rem;"><strong>Tools not in our reviewed list.</strong> Not classified by this tool. Review independently.</p>';
    html += '<div style="display: flex; gap: 6px; flex-wrap: wrap;">' +
      analysis.otherTools.map(function(name) {
        return '<span class="other-tag">' + escapeHtml(name) + '</span>';
      }).join('') + '</div>';
  }
  return html;
}

function renderToolCard(t) {
  return '<div class="tool-review">' +
    '<div class="tool-review-head">' +
      '<p class="tool-review-name">' + t.name + '</p>' +
      '<span class="tool-badge ' + (t.classification === 'high-risk' ? 'high' : (t.classification === 'caution' ? 'caution' : 'low')) + '">' +
        (t.classification === 'high-risk' ? 'High risk' : (t.classification === 'caution' ? 'Caution' : 'Lower risk')) +
      '</span>' +
    '</div>' +
    '<p class="tool-review-body">' + t.reasoning + '</p>' +
    '<p class="tool-review-sources">Sources: ' + t.sources.join('; ') + ' • Last reviewed: ' + t.lastReviewed + '</p>' +
  '</div>';
}

function buildScopeText(profile, modules) {
  var parts = ['NIST AI Risk Management Framework (base assessment)'];
  if (modules.indexOf('nonprofit') !== -1) parts.push('Nonprofit module (based on validated consulting work)');
  if (modules.indexOf('youth') !== -1) parts.push('Youth-serving module (COPPA and safeguards, based on validated consulting work)');
  var text = parts.join(', ') + '.';
  if (profile.industry && ['healthcare','financial','education','government'].indexOf(profile.industry) !== -1) {
    var industryLabel = INDUSTRIES.find(function(i) { return i.id === profile.industry; }).label;
    text += ' Industry-specific overlays for ' + industryLabel + ' are on the roadmap and not yet included in this version. The base assessment applies but does not cover sector-specific regulations (e.g., HIPAA for healthcare, SR 11-7 for financial services, FERPA for education, FedRAMP for government).';
  }
  return text;
}

// Start
renderIntro();
</script>
</body>
</html>
