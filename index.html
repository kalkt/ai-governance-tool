<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Governance Readiness Assessment for SMBs</title>
<style>
  :root {
    --bg: #fafaf7;
    --surface: #ffffff;
    --surface-alt: #f4f2ec;
    --text: #1a1a1a;
    --text-secondary: #5f5e5a;
    --text-muted: #888780;
    --border: rgba(0,0,0,0.08);
    --border-strong: rgba(0,0,0,0.16);
    --accent: #185FA5;
    --accent-bg: #E6F1FB;
    --accent-text: #0C447C;
    --success-bg: #EAF3DE;
    --success-text: #27500A;
    --warning-bg: #FAEEDA;
    --warning-text: #633806;
    --danger-bg: #FCEBEB;
    --danger-text: #791F1F;
    --radius: 8px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 15px;
    line-height: 1.6;
  }
  .container { max-width: 820px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }
  .hero { margin-bottom: 1.5rem; }
  .kicker { font-size: 12px; color: var(--accent); letter-spacing: 0.04em; text-transform: uppercase; margin: 0 0 6px; font-weight: 500; }
  h1 { font-size: 28px; font-weight: 500; margin: 0 0 8px; letter-spacing: -0.01em; }
  h2 { font-size: 18px; font-weight: 500; margin: 0 0 10px; }
  .lede { font-size: 15px; color: var(--text-secondary); margin: 0; }

  .stepper { display: flex; align-items: center; gap: 8px; margin-bottom: 1.5rem; font-size: 12px; color: var(--text-muted); }
  .step { display: flex; align-items: center; gap: 6px; }
  .step.active { color: var(--accent); font-weight: 500; }
  .step-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-muted); }
  .step.active .step-dot { background: var(--accent); }
  .step.complete .step-dot { background: var(--success-text); }
  .step-sep { color: var(--text-muted); }

  .profile-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: 12px; padding: 1.5rem; margin-bottom: 1rem; }
  .field-group { margin-bottom: 1.25rem; }
  .field-group:last-child { margin-bottom: 0; }
  .field-label { display: block; font-size: 14px; font-weight: 500; margin: 0 0 6px; }
  .field-hint { font-size: 12px; color: var(--text-muted); margin: 0 0 8px; }
  .field-required { color: var(--danger-text); }

  .radio-row, .checkbox-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .radio-opt, .check-opt {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 8px 14px; border: 0.5px solid var(--border); border-radius: var(--radius);
    cursor: pointer; font-size: 14px; background: transparent; transition: all 0.12s;
  }
  .radio-opt:hover, .check-opt:hover { border-color: var(--border-strong); }
  .radio-opt.selected, .check-opt.selected { border: 2px solid var(--accent); padding: calc(8px - 1.5px) calc(14px - 1.5px); background: var(--accent-bg); }
  .radio-opt input, .check-opt input { margin: 0; }

  select, input[type="text"] {
    width: 100%; padding: 8px 12px; border: 0.5px solid var(--border); border-radius: var(--radius);
    font: inherit; background: var(--surface); color: var(--text);
  }
  select:focus, input[type="text"]:focus { outline: none; border-color: var(--accent); }

  .tools-search { position: relative; margin-bottom: 1rem; }
  .tools-search input { padding-left: 32px; }
  .tools-search::before {
    content: '⌕'; position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
    color: var(--text-muted); font-size: 16px;
  }
  .tools-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 8px; margin-bottom: 1rem; }
  .tool-card {
    display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px;
    border: 0.5px solid var(--border); border-radius: var(--radius); cursor: pointer;
    background: transparent; text-align: left; transition: all 0.12s;
  }
  .tool-card:hover { border-color: var(--border-strong); }
  .tool-card.selected { border: 2px solid var(--accent); padding: calc(10px - 1.5px) calc(12px - 1.5px); background: var(--accent-bg); }
  .tool-card input { margin: 3px 0 0 0; }
  .tool-info { flex: 1; min-width: 0; }
  .tool-name { font-size: 13px; font-weight: 500; margin: 0 0 2px; }
  .tool-meta { font-size: 11px; color: var(--text-muted); margin: 0; }
  .tool-badge { font-size: 10px; padding: 1px 6px; border-radius: var(--radius); margin-left: 4px; font-weight: 500; vertical-align: 1px; }
  .tool-badge.high { background: var(--danger-bg); color: var(--danger-text); }
  .tool-badge.caution { background: var(--warning-bg); color: var(--warning-text); }
  .tool-badge.low { background: var(--success-bg); color: var(--success-text); }

  .other-tool-input { display: flex; gap: 8px; margin-bottom: 1rem; }
  .other-tool-input input { flex: 1; }
  .other-tool-list { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .other-tag {
    display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px;
    background: var(--accent-bg); color: var(--accent-text); border-radius: var(--radius); font-size: 12px;
  }
  .other-tag button { background: none; border: none; color: inherit; cursor: pointer; padding: 0; font-size: 14px; line-height: 1; }

  .choice-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin: 1.25rem 0 1rem; }
  .choice {
    background: var(--surface); border: 0.5px solid var(--border); border-radius: 12px;
    padding: 1rem 1.25rem; cursor: pointer; text-align: left; font: inherit; color: inherit;
    transition: border-color 0.12s;
  }
  .choice:hover { border-color: var(--border-strong); }
  .choice.selected { border: 2px solid var(--accent); padding: calc(1rem - 1.5px) calc(1.25rem - 1.5px); }
  .choice h3 { font-size: 15px; font-weight: 500; margin: 0 0 6px; }
  .meta { font-size: 12px; color: var(--text-muted); margin: 0 0 8px; }
  .choice p { font-size: 13px; color: var(--text-secondary); margin: 0; }
  .badge { display: inline-block; background: var(--accent-bg); color: var(--accent-text); font-size: 11px; padding: 2px 8px; border-radius: var(--radius); margin-left: 6px; vertical-align: 2px; }

  .callout {
    background: var(--surface-alt); border-radius: var(--radius); padding: 12px 14px;
    font-size: 13px; color: var(--text-secondary); margin: 0.75rem 0 1rem; line-height: 1.5;
  }
  .callout strong { color: var(--text); font-weight: 500; }
  .callout.info { background: var(--accent-bg); color: var(--accent-text); }
  .callout.info strong { color: var(--accent-text); }
  .callout.warning { background: var(--warning-bg); color: var(--warning-text); }
  .callout.warning strong { color: var(--warning-text); }

  button {
    background: var(--surface); border: 0.5px solid var(--border-strong); border-radius: var(--radius);
    padding: 8px 16px; font: inherit; color: var(--text); cursor: pointer; transition: background 0.12s;
  }
  button:hover:not(:disabled) { background: var(--surface-alt); }
  button:active:not(:disabled) { transform: scale(0.98); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button.primary { background: var(--text); color: white; border-color: var(--text); }
  button.primary:hover:not(:disabled) { background: #333; }

  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 0.5rem; }

  .qcard { background: var(--surface); border: 0.5px solid var(--border); border-radius: 12px; padding: 1.5rem; }
  .qhead { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--text-muted); margin-bottom: 8px; }
  .qmodule { display: inline-block; padding: 1px 8px; background: var(--accent-bg); color: var(--accent-text); border-radius: var(--radius); font-size: 11px; font-weight: 500; }
  .progress { height: 4px; background: var(--surface-alt); border-radius: 2px; overflow: hidden; margin-bottom: 16px; }
  .progress span { display: block; height: 100%; background: var(--accent); width: 0; transition: width 0.2s; }
  .qtext { font-size: 17px; font-weight: 500; margin: 0 0 4px; }
  .qmeta { font-size: 13px; color: var(--text-muted); margin: 0 0 14px; }

  .options { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
  .opt {
    display: flex; align-items: center; gap: 10px; padding: 10px 14px;
    border: 0.5px solid var(--border); border-radius: var(--radius);
    cursor: pointer; font-size: 14px; background: transparent;
  }
  .opt:hover { border-color: var(--border-strong); }
  .opt.selected { border: 2px solid var(--accent); padding: calc(10px - 1.5px) calc(14px - 1.5px); background: var(--accent-bg); }
  .opt input { margin: 0; }

  .err { color: var(--danger-text); font-size: 13px; margin: 6px 0 0; }
  .nav { display: flex; justify-content: space-between; gap: 8px; margin-top: 14px; }
  .nav .spacer { flex: 1; }

  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 1rem 0 1.25rem; }
  .stat { background: var(--surface-alt); border-radius: var(--radius); padding: 1rem 1.25rem; }
  .stat-label { font-size: 12px; color: var(--text-secondary); margin: 0 0 4px; }
  .stat-value { font-size: 28px; font-weight: 500; margin: 0; }
  .stat-value.small { font-size: 16px; padding-top: 4px; }

  .tier-pill { display: inline-flex; align-items: center; padding: 4px 12px; border-radius: 12px; font-size: 13px; font-weight: 500; }
  .tier-low { background: var(--success-bg); color: var(--success-text); }
  .tier-med { background: var(--warning-bg); color: var(--warning-text); }
  .tier-high { background: var(--danger-bg); color: var(--danger-text); }

  .section { margin: 1.5rem 0; }

  .fn-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
  .fn { background: var(--surface-alt); border-radius: var(--radius); padding: 12px 14px; }
  .fn-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
  .fn h3 { font-size: 14px; font-weight: 500; margin: 0; }
  .fn-score { font-size: 13px; color: var(--text-secondary); font-weight: 500; }
  .bar { height: 4px; background: var(--surface); border-radius: 2px; overflow: hidden; }
  .bar span { display: block; height: 100%; background: var(--accent); width: 0; transition: width 0.4s; }
  .fn-desc { font-size: 11px; color: var(--text-muted); margin: 6px 0 0; }

  /* Confidence (Likert) step and perception-vs-evidence report section */
  .likert-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: 12px; padding: 1.25rem 1.5rem; margin-bottom: 1rem; }
  .likert-fn-label { font-size: 11px; font-weight: 600; color: var(--accent-text); text-transform: uppercase; letter-spacing: 0.03em; margin: 0 0 6px; }
  .likert-text { font-size: 15px; font-weight: 500; margin: 0 0 12px; }
  .likert-row { display: flex; gap: 6px; }
  .likert-opt { flex: 1; text-align: center; padding: 8px 4px; border: 0.5px solid var(--border); border-radius: var(--radius); cursor: pointer; }
  .likert-opt:hover { border-color: var(--border-strong); }
  .likert-opt.selected { border: 2px solid var(--accent); padding: calc(8px - 1.5px) calc(4px - 1.5px); background: var(--accent-bg); }
  .likert-opt input { display: none; }
  .likert-v { display: block; font-size: 15px; font-weight: 600; color: var(--text); }
  .likert-opt-label { display: block; font-size: 10px; color: var(--text-muted); margin-top: 2px; line-height: 1.2; }
  .gap-badge { font-size: 10px; padding: 1px 8px; border-radius: var(--radius); font-weight: 500; }
  .gap-badge.overconfident { background: var(--warning-bg); color: var(--warning-text); }
  .gap-badge.underconfident { background: var(--accent-bg); color: var(--accent-text); }
  .gap-badge.aligned { background: var(--success-bg); color: var(--success-text); }
  .fn-compare-row { display: flex; align-items: center; gap: 6px; font-size: 10px; color: var(--text-muted); margin-top: 4px; }
  .fn-compare-row .bar { flex: 1; }
  .fn-compare-row .bar.confidence span { background: var(--text-muted); }
  .fn-compare-label { width: 64px; flex-shrink: 0; }

  .rec { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 8px; }
  .rec-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 4px; }
  .rec-title { font-size: 14px; font-weight: 500; margin: 0; }
  .b10-label { font-size: 14px; font-weight: 500; margin: 0; }
  .rec-meta { font-size: 11px; color: var(--text-muted); margin: 0 0 6px; }
  .rec-body { font-size: 13px; color: var(--text-secondary); margin: 0; }
  .rec-source { font-size: 11px; color: var(--text-muted); margin: 6px 0 0; font-style: italic; }
  .prio-critical { background: var(--danger-text); color: white; font-size: 11px; padding: 2px 8px; border-radius: var(--radius); white-space: nowrap; font-weight: 500; }
  .prio-high { background: var(--danger-bg); color: var(--danger-text); font-size: 11px; padding: 2px 8px; border-radius: var(--radius); white-space: nowrap; font-weight: 500; }
  .prio-med { background: var(--warning-bg); color: var(--warning-text); font-size: 11px; padding: 2px 8px; border-radius: var(--radius); white-space: nowrap; font-weight: 500; }
  .prio-low { background: var(--success-bg); color: var(--success-text); font-size: 11px; padding: 2px 8px; border-radius: var(--radius); white-space: nowrap; font-weight: 500; }

  .tool-review { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 8px; }
  .tool-review-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 6px; }
  .tool-review-name { font-size: 14px; font-weight: 500; margin: 0; }
  .tool-review-body { font-size: 13px; color: var(--text-secondary); margin: 0; }
  .tool-review-sources { font-size: 11px; color: var(--text-muted); margin: 6px 0 0; }
  .tool-review-sources a { color: var(--accent); text-decoration: none; }
  .tool-review-sources a:hover { text-decoration: underline; }

  .roadmap { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-top: 0.5rem; }
  .phase { background: var(--surface-alt); border-radius: var(--radius); padding: 14px; }
  .plabel { font-size: 11px; color: var(--text-muted); margin: 0 0 4px; text-transform: uppercase; letter-spacing: 0.04em; font-weight: 500; }
  .phase h4 { font-size: 14px; font-weight: 500; margin: 0 0 8px; }
  .phase ul { margin: 0; padding-left: 18px; font-size: 13px; color: var(--text-secondary); }
  .phase li { margin-bottom: 4px; }

  .scope-banner { background: var(--accent-bg); border-radius: var(--radius); padding: 14px 16px; margin: 1rem 0; font-size: 13px; color: var(--accent-text); line-height: 1.5; }
  .scope-banner strong { font-weight: 500; }

  .disclaimer { font-size: 12px; color: var(--text-muted); margin-top: 1.5rem; padding-top: 1rem; border-top: 0.5px solid var(--border); line-height: 1.5; }
  .disclaimer strong { color: var(--text-secondary); font-weight: 500; }

  .empty-tools { text-align: center; color: var(--text-muted); font-size: 13px; padding: 1rem; font-style: italic; }

  .hidden { display: none; }
</style>
</head>
<body>
<div class="container">
  <div id="stepper" class="stepper hidden"></div>
  <div id="stage-intro"></div>
  <div id="stage-scope" class="hidden"></div>
  <div id="stage-profile" class="hidden"></div>
  <div id="stage-tools" class="hidden"></div>
  <div id="stage-depth" class="hidden"></div>
  <div id="stage-quiz" class="hidden"></div>
  <div id="stage-confidence" class="hidden"></div>
  <div id="stage-report" class="hidden"></div>
</div>

<script type="module">
// UI/state/rendering logic lives in src/ui.js (extracted for B25 so it can be
// imported and tested with jsdom, the same way src/logic.js/src/data.js already
// are). This file is now just the bootstrap: mount the skeleton above and go.
import { mountApp } from './src/ui.js';
mountApp();
</script>
</body>
</html>
